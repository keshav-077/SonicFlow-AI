<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1">
        <animate attributeName="stop-color" values="#667eea;#764ba2;#667eea" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1">
        <animate attributeName="stop-color" values="#764ba2;#f093fb;#764ba2" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circles with pulse animation -->
  <circle cx="200" cy="200" r="180" fill="url(#gradient1)" opacity="0.1">
    <animate attributeName="r" values="180;190;180" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="140" fill="url(#gradient1)" opacity="0.2">
    <animate attributeName="r" values="140;150;140" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.2;0.3;0.2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="200" cy="200" r="100" fill="url(#gradient1)" opacity="0.3">
    <animate attributeName="r" values="100;110;100" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.3;0.4;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Central microphone icon -->
  <g transform="translate(200, 200)" filter="url(#glow)">
    <!-- Microphone body -->
    <rect x="-25" y="-50" width="50" height="70" rx="25" fill="url(#gradient1)">
      <animate attributeName="height" values="70;75;70" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Microphone stand -->
    <path d="M -5 25 L -5 55 M 5 25 L 5 55 M -20 55 L 20 55" 
          stroke="url(#gradient1)" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Sound waves (left) -->
    <path d="M -50 -10 Q -60 0 -50 10" stroke="url(#gradient2)" stroke-width="3" 
          fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; -10,0; 0,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M -65 -20 Q -80 0 -65 20" stroke="url(#gradient2)" stroke-width="3" 
          fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; -15,0; 0,0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M -80 -30 Q -100 0 -80 30" stroke="url(#gradient2)" stroke-width="3" 
          fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; -20,0; 0,0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </path>
    
    <!-- Sound waves (right) -->
    <path d="M 50 -10 Q 60 0 50 10" stroke="url(#gradient2)" stroke-width="3" 
          fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 10,0; 0,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 65 -20 Q 80 0 65 20" stroke="url(#gradient2)" stroke-width="3" 
          fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 15,0; 0,0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M 80 -30 Q 100 0 80 30" stroke="url(#gradient2)" stroke-width="3" 
          fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0; 20,0; 0,0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </path>
  </g>
  
  <!-- Text -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="42" font-weight="bold" 
        fill="url(#gradient1)" text-anchor="middle">
    SonicFlow AI
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="18" 
        fill="#666" text-anchor="middle" opacity="0.8">
    Real-Time Voice Agent
  </text>
</svg>
